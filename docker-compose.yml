    networks: [weather-net]
    restart: on-failure

  # ─── Kafka Stream Processor ───────────────────────────────────────────────────
  kafka-processor:
    build: ./kafka-processor
    container_name: kafka-processor
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [weather-net]
    restart: on-failure

  # ─── Central Station ──────────────────────────────────────────────────────────
  central-station:
    build: ./central-station
    container_name: central-station
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      DB_URL:  jdbc:postgresql://postgres:5432/weather_db
      DB_USER: weather_user
      DB_PASS: weather_pass
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [weather-net]
    restart: on-failure

volumes:
  pg-data:

networks:
  weather-net:
    driver: bridge
